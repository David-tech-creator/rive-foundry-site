<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Fable 5.2 data retention: Copilot vs Bedrock</title><rect width="1200" height="630" fill="#14161a"/><g font-family="Inter, Helvetica, Arial, sans-serif"><text x="60" y="100" font-size="38" font-weight="700" fill="#eef0f3">Fable 5.2 keeps your data by default</text><text x="430" y="205" font-size="30" font-weight="600" fill="#eef0f3">GitHub Copilot</text><text x="820" y="205" font-size="30" font-weight="600" fill="#eef0f3">Bedrock</text><line x1="60" y1="235" x2="1140" y2="235" stroke="#3b9eff" stroke-width="2"/><text x="60" y="320" font-size="26" fill="#9aa3af">Retention</text><text x="430" y="305" font-size="26" fill="#eef0f3">Kept for safety<tspan x="430" dy="36">classifiers</tspan></text><text x="820" y="305" font-size="26" fill="#eef0f3">Up to 30 days,<tspan x="820" dy="36">human review</tspan></text><line x1="60" y1="390" x2="1140" y2="390" stroke="#9aa3af" stroke-width="1" stroke-opacity="0.4"/><text x="60" y="475" font-size="26" fill="#9aa3af">ZDR exemption ends</text><text x="430" y="460" font-size="26" fill="#3b9eff">End of<tspan x="430" dy="36">calendar year</tspan></text><text x="820" y="460" font-size="26" fill="#3b9eff">At least<tspan x="820" dy="36">June 30, 2027</tspan></text><line x1="60" y1="545" x2="1140" y2="545" stroke="#9aa3af" stroke-width="1" stroke-opacity="0.4"/></g></svg>