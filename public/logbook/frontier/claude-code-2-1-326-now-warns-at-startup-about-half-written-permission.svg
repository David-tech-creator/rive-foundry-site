<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>A malformed permission rule triggers a warning, not enforcement</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3af"/></marker></defs><rect width="1200" height="630" fill="#14161a"/><text x="600" y="110" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="600" fill="#eef0f3">Claude Code 2.1.326: a warning, not enforcement</text><g fill="none" stroke="#9aa3af" stroke-width="1.5"><rect x="40" y="200" width="320" height="220" rx="14"/><rect x="440" y="200" width="320" height="220" rx="14"/></g><rect x="840" y="200" width="320" height="220" rx="14" fill="none" stroke="#3b9eff" stroke-width="2"/><g stroke="#9aa3af" stroke-width="1.5"><line x1="370" y1="310" x2="430" y2="310" marker-end="url(#a)"/><line x1="770" y1="310" x2="830" y2="310" marker-end="url(#a)"/></g><g font-family="Inter, Helvetica, Arial, sans-serif" text-anchor="middle"><text x="200" y="270" font-size="28" fill="#eef0f3">Malformed</text><text x="200" y="318" font-size="26" fill="#eef0f3">--disallowedTools</text><text x="200" y="366" font-size="28" fill="#eef0f3">entry</text><text x="600" y="290" font-size="30" fill="#eef0f3">Startup warning</text><text x="600" y="345" font-size="24" fill="#9aa3af">Ctrl+O shows it</text><text x="1000" y="290" font-size="30" fill="#eef0f3">Rule applied?</text><text x="1000" y="345" font-size="26" fill="#3b9eff">Notes don't say</text><text x="600" y="520" font-size="28" fill="#9aa3af">If it's ignored, the deny rule fails open.</text></g></svg>