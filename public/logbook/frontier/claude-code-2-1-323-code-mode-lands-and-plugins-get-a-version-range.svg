<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Who decides what runs in Claude Code 2.1.323</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9eff"/></marker></defs><rect width="1200" height="630" fill="#14161a"/><text x="80" y="105" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#eef0f3">Who decides what runs?</text><text x="80" y="155" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3af">Claude Code 2.1.323</text><line x1="80" y1="200" x2="1120" y2="200" stroke="#2a2e35" stroke-width="1"/><text x="80" y="275" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">Code Mode</text><line x1="520" y1="266" x2="600" y2="266" stroke="#3b9eff" stroke-width="2" marker-end="url(#a)"/><text x="640" y="275" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Opt-in, org off-switch</text><line x1="80" y1="340" x2="1120" y2="340" stroke="#2a2e35" stroke-width="1"/><text x="80" y="415" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">Plugin version mismatch</text><line x1="520" y1="406" x2="600" y2="406" stroke="#3b9eff" stroke-width="2" marker-end="url(#a)"/><text x="640" y="415" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Not installed, updated or loaded</text><line x1="80" y1="480" x2="1120" y2="480" stroke="#2a2e35" stroke-width="1"/><text x="80" y="555" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">Auto mode unavailable</text><line x1="520" y1="546" x2="600" y2="546" stroke="#3b9eff" stroke-width="2" marker-end="url(#a)"/><text x="640" y="555" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Starts in Manual, asks first</text></svg>