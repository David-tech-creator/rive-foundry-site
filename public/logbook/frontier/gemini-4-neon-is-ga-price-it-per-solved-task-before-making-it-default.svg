<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Gemini 4 Neon vs Carbon cost per task</title><desc>Per-token prices and an example task cost for Neon and Carbon, with the break-even rule.</desc><rect width="1200" height="630" fill="#14161a"/><text x="80" y="95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#eef0f3">Same tokens, different bill</text><text x="640" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#3b9eff">Gemini 4 Neon</text><text x="960" y="190" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" font-weight="600" fill="#eef0f3">Carbon (intro to Nov 30)</text><line x1="80" y1="220" x2="1120" y2="220" stroke="#9aa3af" stroke-width="1"/><text x="80" y="305" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Per 1M in / out</text><text x="640" y="310" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#eef0f3">$3 / $15</text><text x="960" y="310" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#eef0f3">$2 / $10</text><line x1="80" y1="355" x2="1120" y2="355" stroke="#9aa3af" stroke-width="1" stroke-opacity="0.5"/><text x="80" y="425" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Example task</text><text x="80" y="460" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3af">400k in, 30k out</text><text x="640" y="445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#eef0f3">$1.65</text><text x="960" y="445" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" fill="#eef0f3">$1.10</text><line x1="80" y1="495" x2="1120" y2="495" stroke="#9aa3af" stroke-width="1"/><text x="80" y="565" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#eef0f3">Neon wins only with <tspan fill="#3b9eff" font-weight="700">under 2/3</tspan> of Carbon's tokens</text></svg>