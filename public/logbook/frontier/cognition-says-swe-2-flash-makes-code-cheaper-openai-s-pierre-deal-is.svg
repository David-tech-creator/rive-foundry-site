<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Writing code gets cheaper, reviewing it doesn't</title><desc>Comparison of SWE-2 Flash (writing) and Pierre (reviewing), with the metrics to measure.</desc><rect width="1200" height="630" fill="#14161a"/><text x="600" y="95" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#eef0f3">Writing gets cheaper. Reading doesn't.</text><rect x="80" y="160" width="500" height="250" rx="14" fill="none" stroke="#9aa3af" stroke-width="1.5"/><text x="330" y="232" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#eef0f3">Writing code</text><text x="330" y="300" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">SWE-2 Flash</text><text x="330" y="350" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">claims low cost, high speed</text><rect x="620" y="160" width="500" height="250" rx="14" fill="none" stroke="#3b9eff" stroke-width="2"/><text x="870" y="232" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#3b9eff">Reviewing code</text><text x="870" y="300" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">Pierre: Trees, Diffs</text><text x="870" y="350" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">OpenAI deal not closed</text><line x1="80" y1="470" x2="1120" y2="470" stroke="#9aa3af" stroke-width="1" opacity="0.5"/><text x="600" y="545" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#eef0f3">Measure: cost per accepted change + <tspan fill="#3b9eff">reviewer minutes</tspan></text></svg>