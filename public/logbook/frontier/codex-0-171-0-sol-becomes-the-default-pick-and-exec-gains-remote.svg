<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Who gets Sol by default in Codex 0.171.0</title><desc>Setups with a model set see no change; setups with no model set, such as codex exec in CI, may switch to Sol.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9aa3af"/></marker><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9eff"/></marker></defs><rect width="1200" height="630" fill="#14161a"/><text x="80" y="105" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#eef0f3">Codex 0.171.0: who gets Sol by default</text><rect x="80" y="180" width="440" height="110" rx="12" fill="none" stroke="#9aa3af" stroke-width="1.5"/><text x="300" y="245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Model already set</text><line x1="540" y1="235" x2="650" y2="235" stroke="#9aa3af" stroke-width="1.5" marker-end="url(#a)"/><rect x="670" y="180" width="450" height="110" rx="12" fill="none" stroke="#9aa3af" stroke-width="1.5"/><text x="895" y="245" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#9aa3af">No change</text><rect x="80" y="340" width="440" height="130" rx="12" fill="none" stroke="#9aa3af" stroke-width="1.5"/><text x="300" y="395" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">No model set</text><text x="300" y="437" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="24" fill="#9aa3af">codex exec in CI</text><line x1="540" y1="405" x2="650" y2="405" stroke="#3b9eff" stroke-width="2" marker-end="url(#b)"/><rect x="670" y="340" width="450" height="130" rx="12" fill="none" stroke="#3b9eff" stroke-width="2"/><text x="895" y="415" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#3b9eff">May switch to Sol</text><text x="80" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Pin CI and log the active model</text></svg>