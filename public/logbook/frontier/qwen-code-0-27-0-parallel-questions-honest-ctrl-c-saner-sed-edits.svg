<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Qwen Code 0.27.0: the record matches reality</title><desc>Before and after table of three fixes in Qwen Code 0.27.0.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3b9eff"/></marker></defs><rect width="1200" height="630" fill="#14161a"/><text x="60" y="95" font-family="Inter, Helvetica, Arial, sans-serif" font-size="38" font-weight="700" fill="#eef0f3">Qwen Code 0.27.0: the record matches reality</text><g font-family="Inter, Helvetica, Arial, sans-serif" font-size="24"><text x="470" y="185" fill="#9aa3af">Before</text><text x="780" y="185" fill="#3b9eff" font-weight="700">0.27.0</text></g><line x1="60" y1="210" x2="1140" y2="210" stroke="#9aa3af" stroke-width="1"/><g font-family="Inter, Helvetica, Arial, sans-serif" font-size="28"><text x="60" y="290" fill="#eef0f3">Cancelled command</text><text x="470" y="290" fill="#9aa3af">"completed"</text><text x="780" y="290" fill="#eef0f3">interrupted, output kept</text><text x="60" y="400" fill="#eef0f3">sed on CRLF/Unicode</text><text x="470" y="400" fill="#9aa3af">failed edits</text><text x="780" y="400" fill="#eef0f3">handled correctly</text><text x="60" y="510" fill="#eef0f3">Child questions</text><text x="470" y="510" fill="#9aa3af">not concurrent</text><text x="780" y="510" fill="#eef0f3">several pending</text></g><g stroke="#3b9eff" stroke-width="2" marker-end="url(#a)"><line x1="700" y1="281" x2="755" y2="281"/><line x1="700" y1="391" x2="755" y2="391"/><line x1="700" y1="501" x2="755" y2="501"/></g><g stroke="#9aa3af" stroke-width="1" opacity="0.4"><line x1="60" y1="340" x2="1140" y2="340"/><line x1="60" y1="450" x2="1140" y2="450"/></g></svg>