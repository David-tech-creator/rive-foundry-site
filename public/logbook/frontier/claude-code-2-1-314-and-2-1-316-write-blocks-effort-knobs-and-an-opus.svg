<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>What the new write block covers in Claude Code 2.1.314 and 2.1.316</title><desc>Write, Edit and NotebookEdit are covered. Bash is not, so keep the sandbox or --restricted on. Opus 4.8 fast mode is removed on 30 November.</desc><rect width="1200" height="630" fill="#14161a"/><text x="600" y="92" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#eef0f3">blockWritesOutsideWorkingDirectories</text><rect x="80" y="140" width="500" height="280" rx="14" fill="none" stroke="#3b9eff" stroke-width="2"/><text x="120" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Covered</text><circle cx="132" cy="250" r="7" fill="#3b9eff"/><text x="160" y="260" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#eef0f3">Write</text><circle cx="132" cy="305" r="7" fill="#3b9eff"/><text x="160" y="315" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#eef0f3">Edit</text><circle cx="132" cy="360" r="7" fill="#3b9eff"/><text x="160" y="370" font-family="Inter, Helvetica, Arial, sans-serif" font-size="30" fill="#eef0f3">NotebookEdit</text><rect x="620" y="140" width="500" height="280" rx="14" fill="none" stroke="#9aa3af" stroke-width="1.5" stroke-dasharray="8 8"/><text x="660" y="192" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Not named</text><text x="660" y="265" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" font-weight="600" fill="#eef0f3">Bash</text><text x="660" y="330" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Keep the sandbox</text><text x="660" y="368" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">or --restricted on</text><line x1="80" y1="475" x2="1120" y2="475" stroke="#9aa3af" stroke-width="1" opacity="0.5"/><text x="80" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="32" font-weight="600" fill="#3b9eff">30 Nov</text><text x="230" y="550" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Opus 4.8 fast mode removed → move to Opus 5.5</text></svg>