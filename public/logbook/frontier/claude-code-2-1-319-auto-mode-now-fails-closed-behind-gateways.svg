<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630"><title>Auto mode behind a gateway: before and after 2.1.319</title><rect width="1200" height="630" fill="#14161a"/><text x="600" y="90" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="34" fill="#eef0f3">Auto mode behind a gateway, unverifiable call</text><rect x="70" y="160" width="460" height="290" rx="12" fill="none" stroke="#9aa3af" stroke-width="1.5"/><rect x="670" y="160" width="460" height="290" rx="12" fill="none" stroke="#3b9eff" stroke-width="2"/><text x="300" y="220" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Before 2.1.319</text><text x="300" y="310" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Built-in classifier</text><text x="300" y="348" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">takes over</text><text x="300" y="410" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">claude -p exits 0</text><text x="900" y="220" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#3b9eff">2.1.319</text><text x="900" y="328" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="28" fill="#eef0f3">Asks or denies</text><text x="900" y="410" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#3b9eff">claude -p exits 1</text><line x1="555" y1="305" x2="638" y2="305" stroke="#9aa3af" stroke-width="1.5"/><polyline points="626,295 640,305 626,315" fill="none" stroke="#9aa3af" stroke-width="1.5"/><text x="600" y="540" text-anchor="middle" font-family="Inter, Helvetica, Arial, sans-serif" font-size="26" fill="#9aa3af">Set CLAUDE_CODE_AUTO_MODE_SERVER on purpose</text></svg>